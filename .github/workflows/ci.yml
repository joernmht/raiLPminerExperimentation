name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Style gates run in their own job. Keeping them inside the test job made a
  # one-file `ruff format` drift hide every test failure behind it — `main` sat
  # red at `Lint` from 2026-08-14 to 2026-09-06 with pytest never running.
  # Independent jobs mean a lint failure costs a lint signal, not all of them
  # (~/.claude/quality/STYLE.md §6, gate-ordering note 2026-08-11).
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff>=0.15.12,<0.16"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # mypy is intentionally NOT gated yet (corpusbuilder type debt; see
      # docs/STACK.md "Known drift"). Re-enable once stubs/annotations land.

  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout raiLPminerExperimentation
        uses: actions/checkout@v4
        with:
          path: main

      # The method library is a sibling checkout (not pinned on PyPI); install it
      # editable with its mining+solver extras so railpminer can import lp2graph.
      - name: Checkout lp2graph
        uses: actions/checkout@v4
        with:
          repository: joernmht/lp2graph
          path: lp2graph

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./lp2graph[mining,solver]"
          pip install -e "./main[dev,corpus]"

      - name: Test
        working-directory: main
        run: pytest

  c-locale:
    # Compatibility gate (ADR-0016). Python's text-I/O defaults follow the
    # locale; on Linux PEP 538/540 hide that by coercing C -> UTF-8. Disabling
    # both drives the preferred encoding to ASCII, which is the closest a
    # ubuntu runner gets to the Windows cp1252 default under which a
    # non-ASCII corpus read mojibakes and a write raises. Every text-I/O call
    # site declares encoding="utf-8", so this must stay green.
    name: c-locale (ascii default)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "0"
      PYTHONCOERCECLOCALE: "0"
      LC_ALL: C
      LANG: C
    steps:
      - name: Checkout raiLPminerExperimentation
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout lp2graph
        uses: actions/checkout@v4
        with:
          repository: joernmht/lp2graph
          path: lp2graph

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./lp2graph[mining,solver]"
          pip install -e "./main[dev,corpus]"

      - name: Test
        working-directory: main
        run: |
          python -c "import locale, sys; print('preferred:', locale.getpreferredencoding(False))"
          pytest
